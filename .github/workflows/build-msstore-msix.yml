name: Build Microsoft Store MSIX (manual)

on:
  push:
    branches:
      - msstore/v2.2.0-msix-prep
    paths:
      - '.github/workflows/build-msstore-msix.yml'
      - 'src-tauri/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/microsoft-store/build-msix.ps1'
      - 'docs/microsoft-store/export-cargo-license-inventory.ps1'
      - 'docs/microsoft-store/sign-msix-for-local-testing.ps1'
      - 'docs/microsoft-store/Package.appxmanifest.template.xml'
      - 'docs/microsoft-store/assets/**'
  workflow_dispatch:
    inputs:
      package_identity_name:
        description: Exact Package/Identity/Name from Partner Center
        required: true
        default: SenecaDPJ.Semanaalplato
        type: string
      package_identity_publisher:
        description: Exact Package/Identity/Publisher from Partner Center
        required: true
        default: CN=6F3CA482-2B0E-4C58-95F1-BFA42598F4C9
        type: string
      publisher_display_name:
        description: Exact visible publisher name for the listing/manifest
        required: true
        default: SenecaDPJ
        type: string
      max_version_tested:
        description: Windows build actually tested; current VM is 10.0.26300.0
        required: true
        default: 10.0.26300.0
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Test and package unsigned x64 MSIX
    runs-on: windows-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build MSIX and Store upload archive
        shell: pwsh
        env:
          STORE_PACKAGE_IDENTITY_NAME: ${{ inputs.package_identity_name || 'SenecaDPJ.Semanaalplato' }}
          STORE_PACKAGE_IDENTITY_PUBLISHER: ${{ inputs.package_identity_publisher || 'CN=6F3CA482-2B0E-4C58-95F1-BFA42598F4C9' }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name || 'SenecaDPJ' }}
          STORE_MAX_VERSION_TESTED: ${{ inputs.max_version_tested || '10.0.26300.0' }}
        run: |
          .\docs\microsoft-store\build-msix.ps1 `
            -PackageIdentityName "$env:STORE_PACKAGE_IDENTITY_NAME" `
            -PackageIdentityPublisher "$env:STORE_PACKAGE_IDENTITY_PUBLISHER" `
            -PublisherDisplayName "$env:STORE_PUBLISHER_DISPLAY_NAME" `
            -MaxVersionTested "$env:STORE_MAX_VERSION_TESTED"

      - name: Create a separate test-signed MSIX for the isolated VM
        shell: pwsh
        env:
          STORE_PACKAGE_IDENTITY_PUBLISHER: ${{ inputs.package_identity_publisher || 'CN=6F3CA482-2B0E-4C58-95F1-BFA42598F4C9' }}
        run: .\docs\microsoft-store\sign-msix-for-local-testing.ps1 -ArtifactsDirectory 'artifacts\msstore\2.2.0.0-x64' -ExpectedPublisher "$env:STORE_PACKAGE_IDENTITY_PUBLISHER"

      - name: Export Cargo dependency license inventory
        shell: pwsh
        run: .\docs\microsoft-store\export-cargo-license-inventory.ps1

      - name: Preserve unsigned package, listing icon and logs for review
        uses: actions/upload-artifact@v4
        with:
          name: msstore-msix-2.2.0-${{ github.sha }}
          path: artifacts/msstore/**
          if-no-files-found: error
          retention-days: 14
