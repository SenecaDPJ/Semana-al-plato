name: Publicar instalador de Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Pruebas y NSIS x64
    runs-on: windows-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar y publicar el instalador
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Semana al Plato v__VERSION__
          releaseBody: |
            Calendario semanal de comidas para Windows 11.

            La versión 2.2.0 reúne el selector bilingüe con la bandera correspondiente (España/Reino Unido), los temas claro y oscuro, colores de categoría legibles y un icono propio para Windows.

            Incluye clonado individual y múltiple, reordenado y movimiento por arrastre dentro de cada categoría, selección de varios elementos y avisos destacados para destinos no válidos.

            El enlace al perfil de GitHub pide confirmación antes de abrirse en el navegador predeterminado.

            ---

            Semana al Plato 2.2.0 brings together the Spanish/English selector with the matching Spain/UK flag, light and dark themes, readable category colours, and a custom Windows icon.

            It includes individual and group cloning, reordering and drag-and-drop within each category, multi-selection, and prominent feedback for invalid drop targets.

            The GitHub profile link asks for confirmation before opening in the default browser.
          releaseDraft: false
          prerelease: false
