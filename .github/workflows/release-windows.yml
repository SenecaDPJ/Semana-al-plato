name: Publicar instalador de Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Pruebas y NSIS x64
    runs-on: windows-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar y publicar el instalador
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Semana al Plato v__VERSION__
          releaseBody: |
            Calendario semanal de comidas para Windows 11.

            La versión 2.1.0 muestra la bandera del idioma activo, reorganiza las acciones de selección múltiple y refuerza la señal visual cuando se intenta mover un elemento a otra categoría.

            También conserva el selector español/inglés, la interfaz traducida, el clonado individual y múltiple, y el movimiento por arrastre dentro de cada categoría.

            El enlace al perfil de GitHub pide confirmación antes de abrirse en el navegador predeterminado.
          releaseDraft: false
          prerelease: false
