name: Publicar instalador de Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Pruebas y NSIS x64
    runs-on: windows-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar y publicar el instalador
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Semana al Plato v__VERSION__
          releaseBody: |
            Semana al Plato 2.3.3 updates the displayed version to match the installed package and adds “Move this week” for multiple selection: keep selected items active and drag them together to another day in the visible week.

            It also includes the Spanish/English interface, light and dark themes, improved category colours, individual item cloning and movement, and JSON backup and restore.

            Meal plans are stored locally. The app asks before opening the GitHub profile.

            ---

            Semana al Plato 2.3.3 actualiza la versión mostrada para que coincida con el paquete instalado y añade «Mover en la semana» para selección múltiple: conserva los elementos seleccionados y permite arrastrarlos juntos a otro día de la semana visible.

            También incluye interfaz en español e inglés, temas claro y oscuro, colores de categoría mejorados, clonado y movimiento individual de elementos, y copia y restauración JSON.

            Los planes se guardan localmente. La aplicación solicita confirmación antes de abrir el perfil de GitHub.
          releaseDraft: false
          prerelease: false
